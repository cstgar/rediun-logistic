<div id="wrapper-container" class="row">
    <div id="container-login" class="col-6 d-flex justify-content-center">
        <form class="col-md-6">
            <h1 class="text-center display-1">REDIUN</h1>
            <div id="usuario" class="d-flex align-items-center mb-4">
                <input type="text" class="form-control" placeholder="Usuario" aria-label="Usuario" aria-describedby="basic-addon2">
                    <span class="input-group-text" id="basic-addon2">&#64;rediun.com</span>
            </div>
            <div id="contra" class="mb-1">
                <label for="inputPassword2" class="visually-hidden">Contraseña</label>
                <input type="password" class="form-control" id="inputPassword2" placeholder="Contraseña">
            </div>
            <div id="change-pswd" class="text-end mb-4 p-0">
                <a class="btn btn-link">Olvide mi contraseña</a>
            </div>
            <div id="btn-login" class="text-center mt-5">
                <button type="submit" class="btn btn-primary btn-lg mb-1">Iniciar sesión</button>
            </div>
            <div id="registro" class="text-end p-0">
                <a routerLink="/registro" class="btn btn-link">Registrarse</a>
            </div>
        </form>
    </div>

    <div id="login-img" class="col-6 d-flex justify-content-end p-0">
        <img src="https://i.imgur.com/t3W1oXY.png" alt="rediun_refrigeradosrojo" class="img-fluid img-full">
    </div>
</div>
